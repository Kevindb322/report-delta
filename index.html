<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1c2a8a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Relatório Delta">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons2/dl-192.png">
<link rel="apple-touch-icon" href="icons2/dl-180.png">
<title>Relatório Deltafrigo</title>
<link rel="stylesheet" href="app.css">
</head>
<body>

<!-- ===================== INÍCIO: lista de relatórios ===================== -->
<section id="home" class="screen">
  <header class="appbar">
    <img class="applogo" src="icons2/dl-192.png" alt="">
    <div class="title"><b>Relatório Deltafrigo</b><small></small></div>
    <button class="icon menu" id="bMenu" data-icon="dots" aria-label="Menu"></button>
  </header>
  <div class="content">
    <button id="updBanner" class="banner upd" hidden></button>
    <button id="bInstall" class="install" hidden></button>
    <div id="folderInfo" class="banner folder" hidden></div>
    <div id="pendingBanner" class="banner" hidden></div>
    <div id="list" class="list"></div>
    <div id="emptyList" class="empty" hidden>
      <div class="emptyIcon" data-icon="file"></div>
      <p>Nenhum relatório ainda</p>
      <small>Toque em "Novo relatório" para começar.</small>
    </div>
    <button id="bImport" class="ghost wide" data-icon-before="folder"><span>Abrir PDF ou JSON salvo…</span></button>
    <p class="foot" id="verInfo"></p>
  </div>
  <button id="bNew" class="fab"><span data-icon="plus"></span><span>Novo relatório</span></button>
</section>

<!-- ===================== EDITOR ===================== -->
<section id="editor" class="screen" hidden>
  <header class="appbar">
    <button class="icon" id="bBack" data-icon="back" aria-label="Voltar"></button>
    <div class="title"><b id="edTitle"></b><small id="edSub"></small></div>
  </header>
  <nav class="tabs" id="tabs">
    <button data-tab="dados"><span data-icon="user"></span><span>Dados</span></button>
    <button data-tab="equipe"><span data-icon="users"></span><span>Equipe</span><i class="cnt" id="cntEquipe"></i></button>
    <button data-tab="horas"><span data-icon="clock"></span><span>Horas</span><i class="cnt" id="cntHoras"></i></button>
    <button data-tab="relatorio"><span data-icon="note"></span><span>Relatório</span><i class="cnt" id="cntRelatorio"></i></button>
    <button data-tab="material"><span data-icon="box"></span><span>Material</span><i class="cnt" id="cntMaterial"></i></button>
    <button data-tab="custos"><span data-icon="money"></span><span>Custos</span><i class="cnt" id="cntCustos"></i></button>
    <button data-tab="assinar"><span data-icon="pen"></span><span>Assinar</span><i class="cnt ok" id="cntAssinar"></i></button>
  </nav>
  <div class="content" id="edContent">
    <div class="tab" id="tab-dados"></div>
    <div class="tab" id="tab-equipe" hidden></div>
    <div class="tab" id="tab-horas" hidden></div>
    <div class="tab" id="tab-relatorio" hidden></div>
    <div class="tab" id="tab-material" hidden></div>
    <div class="tab" id="tab-custos" hidden></div>
    <div class="tab" id="tab-assinar" hidden></div>
  </div>
  <footer class="actions">
    <button id="bPreview" class="secondary"><span data-icon="eye"></span><span>Visualizar</span></button>
    <button id="bSave" class="primary"><span data-icon="save"></span><span>Salvar PDF</span></button>
  </footer>
</section>

<!-- ===================== VISUALIZAR ===================== -->
<section id="preview" class="screen" hidden>
  <header class="appbar">
    <button class="icon" id="bBackPrev" data-icon="back" aria-label="Voltar"></button>
    <div class="title"><b>Visualizar</b><small id="prevSub"></small></div>
  </header>
  <div class="content" id="prevPages"></div>
  <footer class="actions">
    <button id="bPrevEdit" class="secondary"><span data-icon="edit"></span><span>Editar</span></button>
    <button id="bPrevSave" class="primary"><span data-icon="save"></span><span>Salvar PDF</span></button>
  </footer>
</section>

<div id="scrim" hidden></div>
<div id="sheet" class="sheet" hidden role="dialog"></div>

<div id="pad" hidden>
  <div class="padTop">
    <button class="icon" id="padClose" data-icon="close" aria-label="Fechar"></button>
    <b id="padTitle"></b>
    <button class="txt" id="padClear">Limpar</button>
  </div>
  <div class="padArea"><canvas id="padCanvas"></canvas><div class="padLine"></div><span class="padHint">Assine aqui</span></div>
  <div class="padBottom">
    <span class="rot">Vire o celular de lado para ter mais espaço</span>
    <button class="primary" id="padOk"><span data-icon="check"></span><span>Confirmar</span></button>
  </div>
</div>

<div id="toast" role="status"></div>
<input type="file" id="fImport" accept=".pdf,.json,application/pdf,application/json" hidden>
<input type="file" id="fSig" accept="image/*" hidden>
<input type="file" id="fNota" accept="image/*" hidden>
<input type="file" id="fCam" accept="image/*" capture="environment" hidden>

<script src="pdf-lib.min.js"></script>
<script src="ocr/tesseract.min.js"></script>
<script src="xlsx.js"></script>
<script src="custos.js"></script>
<script src="app.js"></script>
</body>
</html>
